name: CI

on:
  push:
    branches: [main, "feature/**", "bugfix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Check for secrets accidentally committed
        run: |
          if grep -rE "(API_KEY|SECRET_KEY|PASSWORD)\s*=\s*['\"][^'\"]+" . \
               --include="*.js" --include="*.ts" --include="*.json"; then
            echo "::error::Possible secret found in source code!"
            exit 1
          fi
